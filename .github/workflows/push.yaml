name: Build and Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.23.4', '24.22.1']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        registry-url: 'https://registry.npmjs.org'
    - run: npm ci
    - run: npm run build
    - name: Verify patched native runtime
      run: node -e "const z=require('node:zlib');const v=process.versions.node;if(!['22.23.4','24.22.1'].includes(v))throw Error(v);const b=Buffer.from('runtime');if(!z.brotliDecompressSync(z.brotliCompressSync(b)).equals(b))throw Error('Brotli');require('node:crypto').randomBytes(16)"
    - run: npm run lint:ci --if-present
    - run: npm run test:coverage --if-present
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7.1.1
      continue-on-error: true
      with:
        use_oidc: true
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.22.1
        registry-url: 'https://registry.npmjs.org'
    - run: npm ci
    - run: npm run build
    - name: Check if version already published
      id: check-version
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        PACKAGE_VERSION=$(node -p "require('./package.json').version")

        echo "Package: $PACKAGE_NAME@$PACKAGE_VERSION"

        # Check if this version exists on npm
        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
          echo "Version $PACKAGE_VERSION already published"
          echo "should_publish=false" >> $GITHUB_OUTPUT
        else
          echo "Version $PACKAGE_VERSION not yet published"
          echo "should_publish=true" >> $GITHUB_OUTPUT
        fi
    - name: Publish to npm
      if: steps.check-version.outputs.should_publish == 'true'
      run: npm publish
    - name: Skip publishing
      if: steps.check-version.outputs.should_publish == 'false'
      run: echo "Skipping publish - version already exists on npm"

  linux-image:
    name: Linux runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build frozen application image
        run: docker build -t simple-mcp-node-security .
      - name: Verify actual image runtime
        run: >-
          docker run --rm --network none --entrypoint node simple-mcp-node-security
          -e "const a=require('node:assert/strict'),z=require('node:zlib');a.equal(process.version,'v22.23.4');a.equal(process.arch,'x64');const b=Buffer.from('native');a.deepEqual(z.brotliDecompressSync(z.brotliCompressSync(b)),b);require('node:crypto').randomBytes(16)"
